basePath: /api
consumes:
- application/json
definitions:
  helpers.SuccessResponseModel:
    properties:
      data: {}
    type: object
  models.ConnectionModel:
    properties:
      linkedAt:
        type: string
      provider:
        type: string
      providerAccountEmail:
        type: string
      providerUserId:
        type: string
    type: object
  models.RoleModel:
    properties:
      name:
        type: string
    type: object
  models.UserModel:
    properties:
      connections:
        items:
          $ref: '#/definitions/models.ConnectionModel'
        type: array
      createdAt:
        example: "2025-12-31T00:00:00Z"
        type: string
      email:
        example: infosliitmcc@gmail.com
        type: string
      id:
        example: 00000000-0000-0000-0000-000000000000
        type: string
      name:
        example: sliitmozillian
        type: string
      password:
        type: string
      private:
        type: boolean
      roles:
        example:
        - admin
        items:
          type: string
        type: array
      updatedAt:
        example: "2025-12-31T00:00:00Z"
        type: string
    type: object
host: accounts.sliitmozilla.org
info:
  contact:
    email: infosliitmcc@gmail.com
    name: Mozilla Campus Club of SLIIT
    url: https://www.sliitmozilla.org/contact/
  description: |-
    API documentation for the authentication service used across all SLIITMozilla.
    We use `helpers.SuccessResponseModel` for successful responses and `helpers.FailureResponseModel` for errors.
    Example success response:
    ```json
    { "data": ... }
    ```
    Example failure response:
    ```json
    { "error": { "code": 500, "message": ... }}
    ```
  license:
    name: MPL-2.0
    url: https://github.com/Mozilla-Campus-Club-of-SLIIT/accounts/blob/main/LICENSE
  title: sliitmozilla Auth Service
  version: "1.0"
paths:
  /authorize:
    get:
      description: |-
        Initiate the authentication flow with the auth service. Any external service should visit this route with a valid redirect
        If the user is already logged in with the auth service, the auth service will redirect the user back to the provided url with a short lived temporary token (1 minute lifespan) - that should be used to complete the authentication
      parameters:
      - description: URL encoded redirect url
        example: http://localhost:3001/callback
        in: query
        name: redirect
        required: true
        type: string
      responses:
        "302":
          description: Redirect to the provided URL with temporary code in query param
            'code'
        "400":
          description: Bad Request - invalid redirect URL
        "500":
          description: Internal Server Error
      summary: Initiate the authentication flow
      tags:
      - Auth
  /login:
    post:
      consumes:
      - application/json
      description: |-
        Endpoint to log in a user with email and password
        Upon successful login user receives a pair of access token (found in response body) and refresh token (found in cookie: refreshToken)
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Access token returned in response body; refresh token is set
            in cookie 'refreshToken'
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  properties:
                    token:
                      type: string
                  type: object
              type: object
        "400":
          description: email and password cannot be empty
        "401":
          description: Invalid credentials
        "500":
          description: Internal Server error
      summary: Login user
      tags:
      - Auth
  /logout:
    post:
      consumes:
      - application/json
      description: Logout user. Clears the refreshToken cookie
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/helpers.SuccessResponseModel'
        "500":
          description: Internal Server Error
      summary: Logout user
      tags:
      - Auth
  /roles:
    get:
      consumes:
      - application/json
      description: Get all roles. Protected route
      produces:
      - application/json
      responses:
        "200":
          description: Role list
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "401":
          description: Not logged in or invalid token
        "403":
          description: Forbidden (admin only route)
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Get all roles
      tags:
      - Roles
    post:
      consumes:
      - application/json
      description: Create a new role. Protected route
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RoleModel'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: name cannot be empty
        "401":
          description: Not logged in or invalid token
        "403":
          description: Forbidden (admin only route)
        "409":
          description: Duplicate role
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Create a new role
      tags:
      - Roles
  /roles/{role}:
    delete:
      consumes:
      - application/json
      description: Delete a role. Protected route
      parameters:
      - description: Role name
        in: path
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Not logged in or invalid token
        "403":
          description: Attempt to delete admin role
        "404":
          description: Role not found
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Delete a role
      tags:
      - Roles
    patch:
      consumes:
      - application/json
      description: Update a role. Protected route
      parameters:
      - description: Role name
        in: path
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Name cannot be empty
        "401":
          description: Not logged in or invalid token
        "403":
          description: Attempt to modify admin role
        "404":
          description: Role not found
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Update a role
      tags:
      - Roles
  /session:
    get:
      consumes:
      - application/json
      description: Get the current session using the access token
      produces:
      - application/json
      responses:
        "200":
          description: Session data
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  properties:
                    id:
                      type: string
                    roles:
                      items:
                        type: string
                      type: array
                  type: object
              type: object
        "401":
          description: Not logged in or invalid token
        "500":
          description: Internal Server error
      security:
      - AccessToken: []
      summary: Get current session
      tags:
      - Auth
  /token:
    post:
      consumes:
      - application/json
      description: |-
        This is the second step of the authorization flow Check GET /api/authorize for more information about the first step of this flow.
        The client should invoke this endpoint with the code received from the previous step.
        The client shall receive a pair of access token (found in response body) and refresh token (found in cookie: refreshToken) after completing all the steps.
        Client can act on behalf of the user after receiving the token pair
      parameters:
      - description: URL encoded code received from previous step
        example: abcdefgh
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access token returned in response body; refresh token is set
            in cookie 'refreshToken'
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  properties:
                    token:
                      type: string
                  type: object
              type: object
        "401":
          description: If token is invalid or expired
        "404":
          description: Token is related to a non-existing user
        "500":
          description: Internal Server error
      summary: Get tokens from code
      tags:
      - Auth
  /token/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the access token with the refresh token
      produces:
      - application/json
      responses:
        "200":
          description: Access token
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  properties:
                    token:
                      type: string
                  type: object
              type: object
        "401":
          description: Invalid or missing refresh token
        "500":
          description: Internal Server Error
      summary: Refresh acess token
      tags:
      - Auth
  /users:
    get:
      consumes:
      - application/json
      description: List all users. Admin only route
      produces:
      - application/json
      responses:
        "200":
          description: User list
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.UserModel'
                  type: array
              type: object
        "401":
          description: Not logged in or invalid token
        "403":
          description: Forbidden (admin only route)
      security:
      - AccessToken: []
      summary: List all users
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Create user
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: name, email or password can't be empty
        "409":
          description: Username or email already in use
        "500":
          description: Internal Server Error
      summary: Create user
      tags:
      - Users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user. Admin only route
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid user id
        "401":
          description: Not logged in or invalid token
        "403":
          description: Cannot delete yourself
        "404":
          description: User not found
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Delete a user
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: |-
        Get a specific user
        If the user has set the profile visibility as public then it is free to view by anyone. If the profile is set to be private, then regular users will not gain the access to this resource.
        However, admin users can still bypass this protection
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  $ref: '#/definitions/models.UserModel'
              type: object
        "400":
          description: Invalid user id
        "401":
          description: Not logged in or invalid token
        "403":
          description: Forbidden. Trying to access another user's account. Admins
            can bypass this
        "404":
          description: User not found
        "500":
          description: Internal Server error
      security:
      - AccessToken: []
      summary: Get a specific user
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: |-
        Update a user. Admin only route
        Not implemented yet
      produces:
      - application/json
      responses:
        "401":
          description: Not logged in or invalid token
        "403":
          description: Forbidden (admin only route)
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Update a user
      tags:
      - Users
  /users/{id}/roles:
    post:
      consumes:
      - application/json
      description: Add a role to the user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RoleModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Role cannot be empty
        "401":
          description: Not logged in or invalid token
        "403":
          description: Forbidden (admin only route)
        "404":
          description: User or role not found
        "409":
          description: Already assigned
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Add a role to the user
      tags:
      - Users
  /users/{id}/roles/{role}:
    delete:
      consumes:
      - application/json
      description: Remove an existing role from the user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role name
        in: path
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid user id
        "401":
          description: Not logged in or invalid token
        "403":
          description: Cannot remove admin from yourself
        "404":
          description: User or role not found
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Remove an existing role from the user
      tags:
      - Users
  /users/me:
    get:
      consumes:
      - application/json
      description: Get current user
      produces:
      - application/json
      responses:
        "200":
          description: Current user
          schema:
            allOf:
            - $ref: '#/definitions/helpers.SuccessResponseModel'
            - properties:
                data:
                  $ref: '#/definitions/models.UserModel'
              type: object
        "400":
          description: User not found. This error can only happen if the user is deleted
            while invoking this endpoint
        "401":
          description: Not logged in or invalid token
        "500":
          description: Internal Server Error
      security:
      - AccessToken: []
      summary: Get current user
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: |-
        Update current user details such as username, social links, etc.
        Endpoint not implemented yet
      produces:
      - application/json
      responses:
        "401":
          description: Not logged in or invalid token
        "500":
          description: Internal Server error
      security:
      - AccessToken: []
      summary: Update current user
      tags:
      - Users
  /users/me/password:
    patch:
      consumes:
      - application/json
      description: |-
        Change password of current user
        Endpoint not implemented yet
      produces:
      - application/json
      responses:
        "401":
          description: Not logged in or invalid token
        "500":
          description: Internal Server error
      security:
      - AccessToken: []
      summary: Change password of current user
      tags:
      - Users
produces:
- application/json
schemes:
- https
- http
securityDefinitions:
  AccessToken:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
